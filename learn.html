<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#fff8ec">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>가</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <title>처음 배우기</title>
</head>
<body>
  <div id="topbar"></div>
  <main class="stage-area">
    <div class="steps" id="steps"><span></span><span></span><span></span><span></span></div>
    <div id="stage" class="stage-area" style="padding:0"></div>
    <div class="say-line" id="line"></div>
    <div class="nav">
      <button class="icon-btn" id="again" aria-label="다시 듣기">🔊</button>
      <button class="icon-btn" id="next" aria-label="다음">▶️</button>
    </div>
    <div id="after"></div>
  </main>

  <script src="js/progress.js"></script>
  <script src="js/speak.js"></script>
  <script src="js/hangul.js"></script>
  <script src="js/common.js"></script>
  <script src="js/jamo.js"></script>
  <script>
    // 자모를 하나도 모르는 아이를 위한 4단계 수업: 만나기 → 따라 말하기 → 낱말 속에서 → 찾기
    const unit = param('unit') || '3-1';
    // 처음에는 헷갈리기 쉬운 짝을 보기에 넣지 않는다
    const SIMILAR = { 'ㄱ': 'ㅋㄴ', 'ㅋ': 'ㄱ', 'ㄴ': 'ㄱㄷ', 'ㄷ': 'ㅌㄴ', 'ㅌ': 'ㄷ', 'ㅂ': 'ㅍㅁ', 'ㅍ': 'ㅂ', 'ㅁ': 'ㅂ',
      'ㅈ': 'ㅊㅅ', 'ㅊ': 'ㅈ', 'ㅅ': 'ㅈ', 'ㅇ': 'ㅎ', 'ㅎ': 'ㅇ', 'ㅏ': 'ㅓㅑ', 'ㅓ': 'ㅏㅕ', 'ㅗ': 'ㅜㅛ', 'ㅜ': 'ㅗㅠ',
      'ㅡ': 'ㅣ', 'ㅣ': 'ㅡ', 'ㅑ': 'ㅏㅕ', 'ㅕ': 'ㅓㅑ', 'ㅛ': 'ㅗㅠ', 'ㅠ': 'ㅜㅛ' };
    const FIND_ROUNDS = 3;
    let J, u, letters = [], li = 0, step = 0, taps = 0, found = 0, speaking = Promise.resolve();

    const info = () => J.byJ[letters[li]];
    const isVowel = () => info().type === 'vowel';
    const stage = () => document.getElementById('stage');
    const nextBtn = document.getElementById('next');

    function line(text) { document.getElementById('line').textContent = text; }
    function say(...parts) {
      speaking = parts.reduce((p, t) => p.then(() => typeof t === 'string' ? Speak.tts(t, 0.75) : Speak.say(t)), Promise.resolve());
      return speaking;
    }

    // 아이에게 들려줄 소개 말
    function introWords() {
      const j = info();
      if (j.type === 'vowel') return ['안녕! 나는 ' + j.say + '야.', j.shape + '.', j.say + '~'];
      const ex = J.byId[j.examples[0]];
      if (!j.sound) return ['안녕! 나는 ' + j.name + '이야.', '앞에 오면 소리가 없어. 뒤에 오는 모음 소리만 나.', ex.word[0] + '! ' + ex.word + '의 ' + ex.word[0] + '!'];
      return ['안녕! 나는 ' + j.name + '이야.', j.sound + ', ' + j.sound + ' 소리가 나.', ex.word + '의 ' + ex.word[0] + '!'];
    }

    function bigLetter(extra = '') {
      return `<button class="learn-letter ${isVowel() ? 'v' : ''} pop-in" id="big">${letters[li]}</button>${extra}`;
    }

    function show() {
      document.querySelectorAll('#steps span').forEach((s, i) => s.classList.toggle('on', i <= step));
      const j = info();
      nextBtn.style.visibility = 'visible';
      if (step === 0) {
        // 1. 만나기
        const ex = J.byId[j.examples[0]];
        stage().innerHTML = bigLetter(`<div class="mid">${ex.emoji}</div>`);
        line(j.type === 'vowel' ? `"${j.say}"` : `${j.name} · "${j.sound || '소리 없음'}"`);
        document.getElementById('big').onclick = () => say(...introWords());
        say(...introWords());
      } else if (step === 1) {
        // 2. 따라 말하기: 글자를 세 번 누르며 소리 내기
        taps = 0;
        nextBtn.style.visibility = 'hidden';
        stage().innerHTML = bigLetter('<div class="progress-stars" id="taps">☆☆☆</div>');
        line('글자를 누르고 따라 말해 봐요');
        say('나를 누르고 따라 말해 봐!');
        document.getElementById('big').onclick = async () => {
          if (taps >= 3) return;
          taps++;
          document.getElementById('taps').textContent = '⭐'.repeat(taps) + '☆'.repeat(3 - taps);
          await Speak.tts(isVowel() ? j.say : (j.sound || j.name), 0.75);
          if (taps === 3) { celebrate(); await Speak.tts(praise()); step++; show(); }
        };
      } else if (step === 2) {
        // 3. 낱말 속에서 만나기
        const exs = j.examples.map(id => J.byId[id]);
        stage().innerHTML = bigLetter(`<div class="examples">${exs.map(w =>
          `<button class="example" data-id="${w.id}"><div class="e">${w.emoji}</div><div class="w">${Jamo.highlight(w.word, letters[li])}</div></button>`).join('')}</div>`);
        line('빨간 글자 속에 ' + letters[li] + ' 친구가 숨어 있어요');
        document.querySelectorAll('.example').forEach(b => b.onclick = () => Speak.say(J.byId[b.dataset.id]));
        (async () => {
          await say('이 낱말들 속에 내가 숨어 있어!');
          for (const b of document.querySelectorAll('.example')) {
            b.classList.add('hint');
            await Speak.say(J.byId[b.dataset.id]);
            b.classList.remove('hint');
          }
        })();
      } else if (step === 3) {
        // 4. 찾기
        found = 0;
        nextBtn.style.visibility = 'hidden';
        askFind();
      }
    }

    function askFind() {
      const target = letters[li];
      const same = J.jamo.filter(x => x.type === info().type).map(x => x.j);
      const pool = same.filter(x => x !== target && !(SIMILAR[target] || '').includes(x));
      const opts = shuffle([target, ...shuffle(pool).slice(0, choiceCount() - 1)]);
      stage().innerHTML = `<div class="progress-stars">${'⭐'.repeat(found)}${'☆'.repeat(FIND_ROUNDS - found)}</div>
        <div class="jamo-row">${opts.map(o => `<button class="jamo-btn" data-j="${o}">${o}</button>`).join('')}</div>`;
      line(letters[li] + ' 찾기! 똑같은 글자를 눌러요');
      const name = info().type === 'vowel' ? info().say : info().name;
      say(name + ', 어디 있지?');
      stage().querySelectorAll('.jamo-btn').forEach(b => b.onclick = async () => {
        if (b.dataset.j !== target) return wrong(b, stage().querySelector(`.jamo-btn[data-j="${target}"]`));
        b.classList.add('on');
        celebrate();
        await Speak.tts(praise());
        if (++found < FIND_ROUNDS) return askFind();
        letterDone();
      });
    }

    async function letterDone() {
      const name = info().type === 'vowel' ? info().say : info().name;
      stage().innerHTML = `<div class="huge">🎉</div>`;
      line(name + ' 친구랑 친해졌어요!');
      await say(name + ' 친구랑 친해졌어!');
      if (li + 1 < letters.length) {
        li++; step = 0;
        nextBtn.style.visibility = 'visible';
        nextBtn.onclick = () => { nextBtn.onclick = onNext; show(); };
        line('다음 친구를 만나러 가요 ▶');
        return;
      }
      nextBtn.style.visibility = 'hidden';
      document.getElementById('again').style.visibility = 'hidden';
      finishActivity('learn-' + unit, document.getElementById('after'));
      // 다음에 할 놀이: 따라 쓰기
      document.querySelector('#after .end-btns').insertAdjacentHTML('afterbegin',
        `<a class="big-btn" style="background:var(--s3)" href="${actHref('trace', unit)}">✍️ 따라 쓰기</a>`);
    }

    function onNext() {
      if (step < 3) { step++; show(); }
    }
    nextBtn.onclick = onNext;
    document.getElementById('again').onclick = () => {
      if (step === 3) return say((info().type === 'vowel' ? info().say : info().name) + ', 어디 있지?');
      const b = document.getElementById('big');
      if (b) b.click();
    };

    (async () => {
      J = await Jamo.load();
      u = await getUnit(unit);
      topbar(unitTitle(u) + ' · 처음 배우기');
      letters = u.jamo;
      await startCover('👶');
      show();
    })();
  </script>
</body>
</html>
