<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#fff8ec">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>가</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <title>한글 놀이터</title>
</head>
<body>
  <div class="topbar">
    <a class="icon-btn" href="parent.html" aria-label="부모방">⚙️</a>
    <div class="title">한글 놀이터</div>
    <a class="sticker-pill" href="stickers.html" aria-label="스티커판">🏅 <span data-sticker-count>0</span></a>
  </div>

  <main>
    <div class="hello" id="hello">안녕! 오늘은 뭐 하고 놀까?</div>
    <a class="today" id="today" href="#" hidden></a>
    <div class="islands" id="islands"></div>
    <div class="section-title" id="stageTitle"></div>
    <div class="units" id="units"></div>
  </main>

  <div class="footer">하루 10분, 엄마·아빠와 함께 놀아요</div>

  <script src="js/progress.js"></script>
  <script src="js/speak.js"></script>
  <script src="js/common.js"></script>
  <script>
    const COLORS = ['var(--s0)', 'var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
    let units = [], stages = [];

    function renderStage(n) {
      const s = stages[n];
      Progress.update(p => { p.lastStage = n; });
      document.querySelectorAll('.island').forEach(el => el.classList.toggle('selected', Number(el.dataset.n) === n));
      document.getElementById('stageTitle').textContent = s.icon + ' ' + n + '단계 · ' + s.name;
      document.getElementById('units').innerHTML = units.filter(u => u.stage === n).map(u => `
        <div class="unit" style="border-top: 10px solid ${COLORS[n]}">
          <div class="big">${u.icon}</div>
          <div class="name"><small>${u.unit}</small> ${u.title}</div>
          <div class="acts">
            ${u.acts.map(a => `<a class="icon-btn act ${isDone(a, u.unit) ? 'done' : ''}" href="${actHref(a, u.unit)}" aria-label="${ACTS[a].label}">
              <span>${ACTS[a].icon}</span><small>${ACTS[a].label}</small></a>`).join('')}
          </div>
        </div>`).join('');
    }

    (async () => {
      const p = Progress.get();
      if (p.childName) {
        document.getElementById('hello').textContent = '안녕, ' + p.childName + '! 오늘은 뭐 하고 놀까?';
      }
      const play = await loadJSON('data/play.json');
      stages = play.stages;
      units = await loadJSON('data/units.json');

      document.getElementById('islands').innerHTML = stages.map(s => {
        const open = s.n <= p.unlockedStage;
        return `<button class="island ${open ? '' : 'locked'}" data-n="${s.n}" style="background:${COLORS[s.n]}" ${open ? '' : 'disabled'}>
          <span class="big">${open ? s.icon : '🔒'}</span>
          <span>${s.n}단계</span>
          <small>${s.name}</small>
        </button>`;
      }).join('');
      document.querySelectorAll('.island:not(.locked)').forEach(el => {
        el.onclick = () => { renderStage(Number(el.dataset.n)); Speak.tts(stages[el.dataset.n].name); };
      });

      renderStage(Math.min(p.lastStage, p.unlockedStage));

      // 오늘의 놀이: 아직 안 한 놀이 중 가장 앞의 것. 무엇부터 할지 몰라도 이것만 누르면 된다
      const next = (() => {
        for (const u of units.filter(x => x.stage <= p.unlockedStage))
          for (const a of u.acts) if (!isDone(a, u.unit)) return { u, a };
        return null;
      })();
      const today = document.getElementById('today');
      if (next) {
        today.href = actHref(next.a, next.u.unit);
        today.innerHTML = `<span class="big">${ACTS[next.a].icon}</span>
          <span>오늘의 놀이<small>${next.u.unit} ${next.u.title}${next.u.title === ACTS[next.a].label ? '' : ' · ' + ACTS[next.a].label}</small></span><span class="go">▶️</span>`;
        today.hidden = false;
      }
    })();
  </script>
</body>
</html>
