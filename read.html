<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#fff8ec">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>가</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <title>문장 읽기</title>
</head>
<body>
  <div id="topbar"></div>
  <main class="stage-area">
    <div class="progress-stars" id="stars"></div>
    <div class="huge" id="pic"></div>
    <div class="sentence" id="sentence"></div>
    <div class="nav">
      <button class="icon-btn" id="play" aria-label="문장 듣기">🔊</button>
      <button class="icon-btn" id="next" aria-label="다음">▶️</button>
    </div>
    <div class="hint-text" id="hint">낱말을 하나씩 눌러 읽어 봐요</div>
    <div id="after"></div>
  </main>
  <script src="js/progress.js"></script>
  <script src="js/speak.js"></script>
  <script src="js/hangul.js"></script>
  <script src="js/common.js"></script>
  <script>
    const unit = param('unit') || '6-1';
    let list = [], idx = 0, tapped = new Set(), busy = false;

    function show() {
      const s = list[idx];
      tapped = new Set();
      document.getElementById('stars').textContent = '⭐'.repeat(idx) + '☆'.repeat(list.length - idx);
      document.getElementById('pic').textContent = s.emoji;
      document.getElementById('sentence').innerHTML = s.text.split(' ').map((w, i) => `<button class="wbtn" data-i="${i}">${w}</button>`).join('');
      document.querySelectorAll('.wbtn').forEach(b => b.onclick = async () => {
        if (busy) return;
        b.classList.add('on');
        await Speak.tts(b.textContent, 0.8);
        b.classList.remove('on');
        b.classList.add('done');
        tapped.add(b.dataset.i);
        if (tapped.size === s.text.split(' ').length) readAll();
      });
      document.getElementById('next').style.visibility = 'hidden';
    }

    async function readAll() {
      if (busy) return;
      busy = true;
      const btns = document.querySelectorAll('.wbtn');
      for (const b of btns) { b.classList.add('on'); await Speak.tts(b.textContent, 0.85); b.classList.remove('on'); }
      busy = false;
      if (tapped.size === btns.length) {
        celebrate();
        document.getElementById('next').style.visibility = 'visible';
      }
    }

    document.getElementById('play').onclick = readAll;
    document.getElementById('next').onclick = () => {
      idx++;
      if (idx >= list.length) {
        document.getElementById('stars').textContent = '⭐'.repeat(list.length);
        document.getElementById('sentence').innerHTML = '';
        document.getElementById('pic').textContent = '🎉';
        document.getElementById('next').style.visibility = 'hidden';
        document.getElementById('hint').textContent = '';
        return finishActivity('read-' + unit, document.getElementById('after'));
      }
      show();
    };

    (async () => {
      const u = await getUnit(unit);
      topbar(unitTitle(u));
      list = (await loadJSON('data/play.json')).sentences[unit];
      show();
    })();
  </script>
</body>
</html>
