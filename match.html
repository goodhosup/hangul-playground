<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#fff8ec">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>가</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <title>짝 맞추기</title>
</head>
<body>
  <div class="topbar">
    <a class="icon-btn" href="index.html" aria-label="처음으로">🏠</a>
    <div class="progress-stars" id="stars"></div>
    <a class="sticker-pill" href="stickers.html">🏅 <span data-sticker-count>0</span></a>
  </div>

  <main class="stage-area">
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div id="after"></div>
  </main>

  <script src="js/progress.js"></script>
  <script src="js/speak.js"></script>
  <script src="js/common.js"></script>
  <script>
    const ROUND = 5;
    const unit = param('unit') || '1-1';
    let pool = [], all = [], qn = 0, locked = false, current = null;

    // 문제 유형: listen = 소리 듣고 그림 고르기, read = 글자 보고 그림 고르기, pic = 그림 보고 글자 고르기
    const MODES = ['listen', 'read', 'listen', 'pic', 'read'];

    function stars() {
      document.getElementById('stars').textContent = '⭐'.repeat(qn) + '☆'.repeat(ROUND - qn);
    }

    function ask() {
      locked = false;
      stars();
      const mode = MODES[qn % MODES.length];
      const answer = pool[qn % pool.length];
      // 같은 단원에서 2개 고르고, 모자라면 다른 단원에서 채움
      let others = shuffle(pool.filter(w => w.id !== answer.id));
      if (others.length < 2) others = others.concat(shuffle(all.filter(w => w.unit !== unit)));
      const options = shuffle([answer, ...others.slice(0, 2)]);
      current = { answer, mode };

      const q = document.getElementById('question');
      if (mode === 'listen') {
        q.innerHTML = '<button class="icon-btn" id="replay" aria-label="다시 듣기" style="width:110px;height:110px;font-size:56px">🔊</button>';
        document.getElementById('replay').onclick = () => Speak.say(answer);
        Speak.tts('어디 있을까?').then(() => Speak.say(answer));
      } else if (mode === 'read') {
        q.innerHTML = '<span>' + answer.word + '</span>';
        Speak.tts('이 글자랑 맞는 그림을 찾아 볼까?');
      } else {
        q.innerHTML = '<span style="font-size:min(30vw,140px)">' + answer.emoji + '</span>';
        Speak.tts('이 그림의 이름은 어떤 글자일까?');
      }

      const c = document.getElementById('choices');
      c.innerHTML = options.map(o => mode === 'pic'
        ? '<button class="choice text" data-id="' + o.id + '">' + o.word + '</button>'
        : '<button class="choice" data-id="' + o.id + '">' + o.emoji + '</button>').join('');
      c.querySelectorAll('.choice').forEach(b => b.onclick = () => pick(b));
    }

    async function pick(btn) {
      if (locked) return;
      if (btn.dataset.id === current.answer.id) {
        locked = true;
        btn.classList.add('right');
        celebrate();
        Progress.markSeen(current.answer.id);
        await Speak.tts(['우와, 맞았어!', '최고야!', '잘 찾았어!'][qn % 3]);
        await Speak.say(current.answer);
        qn++;
        if (qn >= ROUND) return finish();
        ask();
      } else {
        btn.classList.remove('shake');
        void btn.offsetWidth;
        btn.classList.add('shake');
        Speak.tts('다시 찾아볼까?');
      }
    }

    function finish() {
      stars();
      document.getElementById('question').innerHTML = '<span>🎉</span>';
      document.getElementById('choices').innerHTML = '';
      document.getElementById('after').innerHTML =
        '<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">' +
        '<button class="big-btn" onclick="location.reload()">한 번 더!</button>' +
        '<a class="big-btn" style="background:var(--s2)" href="index.html">처음으로</a></div>';
      if (Progress.reward('match-' + unit)) showStickerToast();
      else { celebrate(true); Speak.tts('다 맞혔어! 정말 잘했어!'); }
    }

    (async () => {
      all = await loadJSON('data/words.json');
      pool = shuffle(all.filter(w => w.unit === unit));
      // 시작 화면: 첫 터치가 있어야 소리가 나는 기기(iOS) 대비
      const cover = document.createElement('div');
      cover.className = 'start-cover';
      cover.innerHTML = '<div class="big">🎯</div><button class="big-btn">시작!</button>';
      document.body.appendChild(cover);
      cover.querySelector('button').onclick = () => { cover.remove(); ask(); };
    })();
  </script>
</body>
</html>
